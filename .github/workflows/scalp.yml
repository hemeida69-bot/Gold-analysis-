name: Agent collector
on:
  schedule:
    - cron: "*/15 * * * 0-5"
  workflow_dispatch:
    inputs:
      seconds:
        description: "collection seconds"
        default: "1500"
permissions:
  contents: write
  actions: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect XAUUSD ticks and run the agent every 5 minutes
        run: python -u collect.py
        env:
          COLLECT_SEC: ${{ github.event.inputs.seconds || '1500' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALERTS: ${{ vars.ALERTS }}
          GH_TOKEN: ${{ github.token }}
