name: Scalp collector
on:
  schedule:
    - cron: "*/15 * * * 0-5"
  workflow_dispatch:
    inputs:
      seconds:
        description: "collection seconds"
        default: "780"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: scalp
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      changed: ${{ steps.save.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect XAUUSD ticks into M1 candles
        run: python -u collect.py
        env:
          COLLECT_SEC: ${{ github.event.inputs.seconds || '780' }}
      - name: Scalp engine
        run: python -u scalp.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - id: save
        name: Save data
        run: |
          git config user.name "gold-bot"
          git config user.email "gold-bot@users.noreply.github.com"
          git add candles.json scalp.json signals.json
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "Scalp update"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push && break; sleep 4; done
          echo "changed=true" >> "$GITHUB_OUTPUT"
  deploy:
    needs: collect
    if: ${{ needs.collect.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deploy
        uses: actions/deploy-pages@v4
