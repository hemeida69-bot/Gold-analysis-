name: Update gold analysis
on:
  schedule:
    - cron: "0 5 * * 1-5"
    - cron: "35 * * * 0-5"
    - cron: "50 * * * 0-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "full = analysis + live, live = price only"
        default: "full"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate analysis
        run: python -u update.py 2>&1 | tee run.log
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVENT: ${{ github.event_name }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NOTIFY_ALL: ${{ vars.NOTIFY_ALL }}
          MODE: ${{ github.event.inputs.mode || ((github.event_name == 'schedule' && github.event.schedule != '0 5 * * 1-5') && 'live' || 'full') }}
      - name: Save data
        if: always()
        run: |
          git config user.name "gold-bot"
          git config user.email "gold-bot@users.noreply.github.com"
          git add data.json history.json live.json spot.json macro.json xau.json notify.json
          git diff --cached --quiet || git commit -m "Daily update"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push && break; sleep 4; done
  deploy:
    needs: update
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deploy
        uses: actions/deploy-pages@v4
