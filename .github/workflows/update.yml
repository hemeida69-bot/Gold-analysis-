name: Update gold analysis
on:
  schedule:
    - cron: "0 5 * * 1-5"
    - cron: "10 * * * 0-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "full = analysis + live, live = price only"
        default: "full"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate analysis
        run: python -u update.py 2>&1 | tee run.log
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NOTIFY_ALL: ${{ vars.NOTIFY_ALL }}
          MODE: ${{ github.event.inputs.mode || ((github.event_name == 'schedule' && github.event.schedule != '0 5 * * 1-5') && 'live' || 'full') }}
      - name: Save data
        if: always()
        run: |
          git config user.name "gold-bot"
          git config user.email "gold-bot@users.noreply.github.com"
          git add data.json history.json live.json spot.json macro.json xau.json notify.json
          [ -f probe.json ] && git add probe.json || true
          git diff --cached --quiet || (git commit -m "Daily update" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deploy
        uses: actions/deploy-pages@v4
