<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gold">
<title>XAUUSD Desk</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0a0f1c;--card:#111a2e;--ink:#e8ecf5;--muted:#8f9bb5;--line:#22304d;--soft:#18233d;--gold:#e0b04a;--goldbg:#3a3017;--up:#4fc79a;--upbg:#14352a;--down:#ef8585;--downbg:#3b1d1f;--flat:#8f9bb5;--r:14px;box-sizing:border-box}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;overflow-x:hidden;-webkit-text-size-adjust:100%;touch-action:manipulation}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;line-height:1.7;font-size:16px;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{background:var(--card);border-inline-start:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;align-self:start;overflow-y:auto}
nav h1{font-size:18px;margin:0 8px 14px}nav h1 small{display:block;color:var(--muted);font-weight:400;font-size:12px}
nav a{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:15px}
nav a i{font-style:normal;width:20px;text-align:center;color:var(--muted)}
nav a small{display:block;color:var(--muted);font-size:11px;line-height:1.2}
nav a.on{background:var(--soft);font-weight:700}nav a.on i{color:var(--gold)}
main{padding:20px 22px 48px;max-width:980px;width:100%}
@media(max-width:860px){.app{grid-template-columns:1fr}nav{position:static;height:auto;border:0;border-bottom:1px solid var(--line);padding:10px 8px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}nav h1{width:100%;margin:2px 8px}nav a{padding:8px 10px;font-size:14px;flex:1 1 44%}nav a small{display:none}main{padding:14px 12px 40px}}
h2{font-size:21px;margin:0 0 4px}.sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:16px;color:var(--muted);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kv{background:var(--soft);border-radius:12px;padding:10px 12px}.kv span{display:block;color:var(--muted);font-size:12px}.kv b{font-size:20px;font-variant-numeric:tabular-nums}
.big{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.badge{display:inline-block;padding:2px 12px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}
.b-wait{background:var(--goldbg);color:var(--gold)}.b-ready,.b-active,.b-up{background:var(--upbg);color:var(--up)}.b-inv,.b-down{background:var(--downbg);color:var(--down)}.b-no,.b-flat{background:var(--soft);color:var(--muted)}
.hero{border-width:2px}.hero.wait{border-color:var(--gold)}.hero.ready,.hero.active{border-color:var(--up)}.hero.inv{border-color:var(--down)}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.headline{font-size:24px;font-weight:700;margin:8px 0 2px}
.note{background:var(--goldbg);color:var(--gold);border-radius:10px;padding:8px 12px;font-size:13px;margin:0 0 14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:700px){.two{grid-template-columns:1fr}}
.lv{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}.lv:first-of-type{border:0}
.lv .p{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}.lv small{color:var(--muted);display:block;font-size:12px}
.pos{color:var(--up)}.neg{color:var(--down)}.dim{opacity:.5}
.ladder{position:relative;height:340px;margin:8px 4px;border-inline-start:2px solid var(--line)}
.mk{position:absolute;inset-inline-start:0;display:flex;align-items:center;gap:8px;transform:translateY(50%);font-size:13px;width:100%}
.mk i{display:block;width:22px;height:2px;background:currentColor;flex:none}.mk b{font-variant-numeric:tabular-nums}
.mk.now{color:var(--gold);font-weight:700}.mk.now i{height:4px}.mk.buy,.mk.u{color:var(--down)}.mk.sell,.mk.d{color:var(--up)}.mk.sw{opacity:.4}
.tl{position:relative;height:76px;background:var(--soft);border-radius:12px;margin:10px 0}
.tl .seg{position:absolute;top:10px;height:22px;border-radius:6px;background:var(--goldbg);color:var(--gold);font-size:12px;text-align:center;line-height:22px;overflow:hidden}
.tl .seg.s1{top:10px}.tl .seg.s2{top:28px;background:var(--upbg);color:var(--up)}.tl .seg.s3{top:46px;background:var(--downbg);color:var(--down)}
.tl .nowm{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
.tl .hrs{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-between;font-size:10px;color:var(--muted);padding:0 4px;direction:ltr}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:start;padding:8px 6px;border-top:1px solid var(--line)}th{color:var(--muted);font-weight:500;border:0}
.scroll{overflow-x:auto}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar div{height:100%;background:var(--gold)}
.row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}.row:first-of-type{border:0}.row p{margin:0}.row small{color:var(--muted);display:block}
.sc{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}.sc h4{margin:0 0 4px;display:flex;justify-content:space-between;gap:8px;font-size:16px}.sc p{margin:4px 0;font-size:15px}.sc .l{color:var(--muted);font-size:14px}
svg.chart{width:100%;height:150px}svg.chart polyline{fill:none;stroke:var(--gold);stroke-width:2.5;vector-effect:non-scaling-stroke}
footer{color:var(--muted);font-size:12px;margin-top:22px}
.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--bg);padding:8px 0 10px;margin-bottom:10px;border-bottom:1px solid var(--line)}
.top b.px{font-size:28px;font-variant-numeric:tabular-nums}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.btn{background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font:inherit;font-size:14px;cursor:pointer}.btn.on{border-color:var(--gold);color:var(--gold)}.btn.pri{background:var(--gold);color:#0b1220;font-weight:700;border-color:var(--gold)}.btn:disabled{opacity:.6}
.tfs{display:flex;gap:6px;margin-inline-start:auto}
#chart{width:100%;min-height:340px;direction:ltr}.chartcard{padding:8px}
.plan{border-width:2px}.plan.pb{border-color:var(--up)}.plan.ps{border-color:var(--down)}.plan .sym{color:var(--muted);font-size:13px}.plan .side{font-size:34px;font-weight:700;line-height:1.1}
.lines{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}.lines>div{background:var(--soft);border-radius:10px;padding:8px 10px}.lines span{display:block;color:var(--muted);font-size:12px}.lines b{font-size:18px;font-variant-numeric:tabular-nums}.lines small{display:block;color:var(--muted);font-size:11px}
.ck{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 0}.ck span{font-size:14px}.ck .ok{color:var(--up)}.ck .no{color:var(--muted)}
#toasts{position:fixed;inset-inline:12px;bottom:14px;z-index:20;display:flex;flex-direction:column;gap:8px;pointer-events:none}.toast{background:var(--card);border:1px solid var(--gold);border-radius:12px;padding:10px 14px;font-size:14px;box-shadow:0 6px 20px #0008;pointer-events:auto}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}.chk:first-of-type{border:0}.chk i{font-style:normal;font-weight:700;width:18px;flex:none}.chk small{color:var(--muted);display:block}
.pdbar{position:relative;height:22px;border-radius:11px;background:linear-gradient(90deg,var(--upbg),var(--soft) 50%,var(--downbg));margin:12px 0}.pdbar i{position:absolute;top:-4px;width:4px;height:30px;background:var(--gold);border-radius:2px}
.steps div{font-size:13px;color:var(--muted);padding:2px 0}.steps b{color:var(--up)}.steps{margin-bottom:10px}
pre.expl{white-space:pre-wrap;margin:0;font:inherit;font-size:14px;line-height:1.7;direction:rtl;text-align:start}
code{background:var(--soft);padding:1px 6px;border-radius:6px;font-size:13px}
</style>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script src="engine.js"></script>
</head>
<body>
<div class="app">
<nav id="nav"></nav>
<div id="toasts"></div>
<main id="view"><p class="sub">جاري التحميل...</p></main>
</div>
<script>
const $=id=>document.getElementById(id);
const f0=n=>n==null?"-":Number(n).toLocaleString("en-US",{maximumFractionDigits:0});
const f2=n=>n==null?"-":Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const sg=(n,d=2)=>n==null?"-":(n>0?"+":"")+Number(n).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const tm=ep=>ep?new Date(ep*1000).toLocaleString("en-GB",{timeZone:"Africa/Cairo",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"-";
const PAGES=[["live","◉","Live Analysis","تحليل مباشر"],["scen","⇄","Scenarios","سيناريوهات BUY / SELL"],["liq","≋","Liquidity","خريطة السيولة"],["news","✦","News","الأخبار"],["jrnl","▤","Trade Journal","يومية الصفقات"],["dash","▦","Dashboard","الماكرو"],["sess","◷","Sessions","الجلسات"],["perf","◎","Signal Performance","دقة الاتجاه"],["set","⚙","Settings","الإعدادات"]];
const S={data:null,live:null,xau:null,scalp:null};
const J=async u=>{try{const r=await fetch(u+"?"+Date.now(),{cache:"no-store"});if(!r.ok)return null;return await r.json()}catch(e){return null}};

/* ---------- reusable components ---------- */
const STM={WAITING:["WAIT","b-wait","wait"],READY:["READY","b-ready","ready"],ACTIVE:["ACTIVE","b-active","active"],INVALIDATED:["INVALIDATED","b-inv","inv"],"NO TRADE":["NO TRADE","b-no","no"]};
const StatusBadge=s=>{const m=STM[s]||[s||"-","b-no","no"];return `<span class="badge ${m[1]}">${m[0]}</span>`};
const PriceLevel=(label,v,sub)=>`<div class="kv"><span>${label}</span><b>${f2(v)}</b>${sub?`<span>${sub}</span>`:""}</div>`;
const unavail=(t,msg)=>`<div class="card"><h2>${t}</h2><p class="sub">Data unavailable — ${msg||"البيانات غير متاحة حالياً. هتظهر بعد التحديث الجاي."}</p></div>`;
const head=(t,s)=>`<h2>${t}</h2><p class="sub">${s||""}</p>`;
const srcNote=m=>`<p class="note">XAUUSD الفوري · مبني على إغلاقات الساعة المسجلة (${m.n_closes} إغلاق)، يعني المستويات بالإغلاق مش بالقمم والقيعان الفعلية. ${m.closed?"السوق مقفول: القيم من آخر جلسة. ":""}آخر تحديث ${m.updated} القاهرة.</p>`;
function LiquidityLevel(l){const sw=l.swept;return `<div class="lv ${sw?"dim":""}"><div><span class="p">${f2(l.price)}</span><small>${l.label} · ${l.kind}</small></div><div style="text-align:end"><b class="${l.dist>0?"pos":"neg"}">${sg(l.dist,1)}</b><small>${sw?"SWEPT":"ACTIVE"}</small></div></div>`}
function NoTradeCard(nt,st){return `<div class="card hero no"><div class="head"><div><h3>القرار الحالي</h3><div class="headline">${st==="NO TRADE"?"NO TRADE":"WAIT"}</div></div>${StatusBadge(st)}</div>
<p class="sub">قرار "لا تداول" قرار احترافي. حماية رأس المال أهم من أي صفقة.</p></div>`}
function SessionCard(s){const B={OPEN:"b-up",CLOSED:"b-flat",UPCOMING:"b-wait"};const NX=s.next_open?`<p class="sub" style="margin:0 0 8px">يفتح ${s.next_open.cairo} القاهرة (بعد ${s.next_open.in_h} ساعة)</p>`:"";
return `<div class="card"><div class="head"><h2 style="font-size:19px">${s.ar} <small style="color:var(--muted);font-weight:400">${s.name.toUpperCase()}</small></h2><span class="badge ${B[s.status]}">${s.status}</span></div>
<p class="sub" style="margin:0 0 6px">${s.start_cairo} - ${s.end_cairo} بتوقيت القاهرة</p>${NX}
${s.has_data?`<div class="grid"><div class="kv"><span>High (إغلاق)</span><b>${f2(s.high)}</b></div><div class="kv"><span>Low (إغلاق)</span><b>${f2(s.low)}</b></div><div class="kv"><span>Range</span><b>${f2(s.range)}</b></div></div>
<p style="margin:10px 0 0">موقع السعر: <b>${s.position}</b> · جلسة يوم ${s.ref_day}</p>${s.events.length?`<ul style="margin:6px 0 0;padding-inline-start:18px">${s.events.map(e=>`<li>${e}</li>`).join("")}</ul>`:`<p class="sub" style="margin:6px 0 0">لا أحداث سحب سيولة مسجلة.</p>`}`:`<p class="sub" style="margin:0">لا بيانات مسجلة للجلسة دي لسه.</p>`}</div>`}
const PerformanceCard=(t,v,s)=>`<div class="kv"><span>${t}</span><b>${v}</b>${s?`<span>${s}</span>`:""}</div>`;

/* ---------- pages ---------- */
function pDash(){
 const L=S.live,D=S.data,m=S.xau;let h=head("XAUUSD Desk","لوحة قرار على XAUUSD الفوري مبنية على إغلاقات الساعة");
 if(S.an&&S.an.status!=="NO_DATA")h+=`<a href="#/live" style="text-decoration:none;color:inherit">${agentHero()}</a>`;
 if(L){h+=`<div class="card"><h3>XAUUSD الآن <span id="lvTag" class="badge b-flat">...</span></h3><div class="big" id="lp">${f2(S.px?S.px.price:L.price)}</div><div class="${L.chg24h_pct>=0?"pos":"neg"}">${L.full24?"24 ساعة: ":"من أول تسجيل: "}${sg(L.chg24h_pct)}% · ساعة: ${sg(L.chg1h_pct)}%</div>
 <p class="sub" style="margin:6px 0 0">آخر سعر ${L.t} القاهرة · أعلى 24س ${f2(L.hi24)} · أدنى ${f2(L.lo24)} · ${L.src}${L.closed?" · السوق مقفول":""}</p></div>`;
 h+=`<div class="card"><h3>إغلاقات الساعة <small style="color:var(--muted)">(بتتسجل عند بداية كل ساعة)</small></h3><table><thead><tr><th>الوقت</th><th>السعر</th><th>التغير</th></tr></thead><tbody>${(L.hours||[]).length?L.hours.map(r=>`<tr><td>${r[0]}</td><td><b>${f2(r[1])}</b></td><td class="${r[2]>0?"pos":r[2]<0?"neg":""}">${r[2]==null?"-":sg(r[2])}</td></tr>`).join(""):'<tr><td colspan="3">الجدول بيتملّى مع أول ساعات التداول.</td></tr>'}</tbody></table></div>`}
 else h+=unavail("السعر الحي");
 if(L&&L.ts&&!closedNow()&&(Date.now()/1000-L.ts)>5400)h+=`<p class="note">آخر تسجيل ساعي متأخر (${L.updated}). الجدولة عند GitHub بتتأخر أحياناً، والسعر المباشر فوق لسه شغال.</p>`;
 if(D){const T={up:"داعم",down:"ضاغط",flat:"محايد"};
 h+=`<div class="card"><h3>الاتجاه الكلي (عوامل الماكرو + إغلاقات الساعة)</h3><div class="head"><span class="badge b-${D.bias.dir}" style="font-size:18px">${D.bias.label}</span><span class="sub" style="margin:0">ثقة ${D.bias.conf}%</span></div><div class="bar" style="margin:10px 0"><div style="width:${D.bias.conf}%"></div></div><p style="margin:0">${D.bias.summary}</p></div>
 <div class="card"><h3>ليه؟ العوامل المؤثرة</h3>${D.drivers.map(d=>`<div class="row"><span class="badge b-${d.s}">${T[d.s]}</span><p><b>${d.n}</b><small>${d.why}</small></p></div>`).join("")}</div>
 <div class="card"><h3>سيناريوهات الماكرو (24 ساعة)</h3>${D.scen.map(s=>`<div class="sc"><h4><span>${s.n}</span><span>${s.p}%</span></h4><p>${s.txt}</p><p class="l">التفعيل: <b>${s.trig}</b> · الإلغاء: <b>${s.inv}</b></p></div>`).join("")}</div>`;
 h+=`<footer>${D.note}<br>النسب تقديرات وليست ضماناً. للمعلومات فقط وليس نصيحة استثمارية.</footer>`}
 return h}

function pLiqOld(){
 const m=S.xau;if(!m||!m.liquidity)return unavail("Liquidity Map");
 const L=m.liquidity,lv=L.levels,price=S.live?S.live.price:m.price;
 let h=head("Liquidity Map","فين السيولة قاعدة حوالين السعر")+srcNote(m);
 const nb=L.nearest_bsl,ns=L.nearest_ssl;
 const near=nb&&ns?(Math.abs(nb.dist)<=Math.abs(ns.dist)?["Buy-side",nb]:["Sell-side",ns]):nb?["Buy-side",nb]:ns?["Sell-side",ns]:null;
 h+=`<div class="card hero ${near?"wait":"no"}"><h3>Nearest liquidity target</h3>${near?`<div class="big">${f2(near[1].price)}</div><p class="sub" style="margin:0">${near[0]} · ${near[1].label} · ${sg(near[1].dist,1)} نقطة</p>`:`<p class="sub">لا توجد سيولة غير مسحوبة قريبة.</p>`}</div>
 <div class="grid" style="margin-bottom:14px">${PriceLevel("Nearest Buy-side",nb&&nb.price,nb?nb.label+" · "+sg(nb.dist,1):"-")}${PriceLevel("Nearest Sell-side",ns&&ns.price,ns?ns.label+" · "+sg(ns.dist,1):"-")}</div>`;
 const vis=lv.filter(x=>Math.abs(x.dist)<=40);
 if(vis.length){const ps=vis.map(x=>x.price).concat([price]),mx=Math.max(...ps)+4,mn=Math.min(...ps)-4;
 h+=`<div class="card"><h3>سلّم السعر والسيولة</h3><div class="ladder">${vis.map(x=>`<div class="mk ${x.side}${x.swept?" sw":""}" style="bottom:${(x.price-mn)/(mx-mn)*100}%"><i></i><b>${f2(x.price)}</b><span>${x.label}${x.swept?" ✕":""}</span></div>`).join("")}<div class="mk now" style="bottom:${(price-mn)/(mx-mn)*100}%"><i></i><b>${f2(price)}</b><span>السعر</span></div></div></div>`}
 const buy=lv.filter(x=>x.side==="buy").sort((a,b)=>a.dist-b.dist),sell=lv.filter(x=>x.side==="sell").sort((a,b)=>b.dist-a.dist);
 h+=`<div class="two"><div class="card"><h3>BUY-SIDE LIQUIDITY</h3>${buy.length?buy.map(LiquidityLevel).join(""):"<p class='sub'>لا يوجد.</p>"}</div><div class="card"><h3>SELL-SIDE LIQUIDITY</h3>${sell.length?sell.map(LiquidityLevel).join(""):"<p class='sub'>لا يوجد.</p>"}</div></div>`;
 return h}

function pNo(){
 const m=S.xau;if(!m||!m.no_trade)return unavail("No Trade Zone");
 const n=m.no_trade,st=m.decision.status;
 let h=head("No Trade Zone","الصفحة اللي بتقولك امتى متتداولش")+srcNote(m)+NoTradeCard(n,n.active?"NO TRADE":st);
 if(n.active)h+=`<div class="card"><h3>المنطقة</h3><div class="big">${f2(n.zone.lo)} - ${f2(n.zone.hi)}</div></div>`;
 h+=`<div class="card"><h3>Why? ليه</h3>${n.reasons.length?n.reasons.map(r=>`<div class="row"><span class="badge b-no">${r.code}</span><p>${r.text}</p></div>`).join(""):`<p class="sub" style="margin:0">مفيش سبب يمنع التداول حالياً. الحالة: ${st}.</p>`}</div>
 <div class="card"><h3>المطلوب قبل التداول</h3>${n.need.length?`<ul style="margin:0;padding-inline-start:18px">${n.need.map(x=>`<li>${x}</li>`).join("")}</ul>`:`<p class="sub" style="margin:0">لا شيء إضافي.</p>`}</div>
 <div class="card"><h3>المستوى اللي بيغيّر الصورة</h3><p style="margin:0">${n.invalidates}</p></div>`;return h}

function pSess(){
 const m=S.xau;if(!m||!m.sessions)return unavail("Trading Sessions");

function mergeLive(){const last=S.m1.length?S.m1[S.m1.length-1][0]:0;
 Object.keys(S.lr).map(Number).sort((a,b)=>a-b).forEach(m=>{const r=S.lr[m];if(m<last-120){delete S.lr[m];return}
  const tail=S.m1[S.m1.length-1];
  if(tail&&tail[0]===m){tail[2]=Math.max(tail[2],r[2]);tail[3]=Math.min(tail[3],r[3]);tail[4]=r[4]}else if(!tail||m>tail[0])S.m1.push(r.slice())})}
function feedTick(p){const m=Math.floor(nowS()/60)*60,r=S.lr[m];
 if(r){if(p>r[2])r[2]=p;if(p<r[3])r[3]=p;r[4]=p;r[5]++}else S.lr[m]=[m,p,p,p,p,1];
 const tail=S.m1[S.m1.length-1];
 if(tail&&tail[0]===m){if(p>tail[2])tail[2]=p;if(p<tail[3])tail[3]=p;tail[4]=p}else if(!tail||tail[0]<m)S.m1.push([m,p,p,p,p,1])}
async function pxTick(){
 try{const r=await fetch("https://api.gold-api.com/price/XAU",{cache:"no-store"});const d=await r.json();
  if(!(d.price>1000))throw new Error("bad");
  S.px={price:d.price,at:Date.now()};S.pxAt=Date.now();S.pxFail=0;feedTick(d.price);paintTop();
  try{if(S.series&&S.chart&&window.Engine){const cs=Engine.candlesFor(S.m1.slice(-1500),CFG.tf,nowS()),c=cs[cs.length-1];if(c)S.series.update({time:c[0],open:c[1],high:c[2],low:c[3],close:c[4]})}}catch(e){}
  if(CFG.auto&&Math.floor(nowS()/300)!==S.m5k){runAnalysis("new M5 candle");softRender()}
 }catch(e){S.pxFail++;paintTop()}}

   if(CFG.zones)[].concat(a.h1.zones||[],a.m15.zones||[]).filter(z=>near(z.lo)||near(z.hi)).slice(-4).forEach(z=>{const c=z.side==="SUPPLY"?COL.sell:COL.buy;line(se,z.hi,c,z.tf+" "+(z.side==="SUPPLY"?"SUP":"DEM"),3);line(se,z.lo,c,"",3)});

 h+=BiasStrip(a);
 h+=`<div class="card chartcard"><div id="chart"></div><p class="sub" style="margin:6px 4px 2px;font-size:12px">${CFG.tf} · شموع مبنية من سعر XAUUSD الفوري (عينات كل 10 ثواني). الأوقات بتوقيت القاهرة.</p></div>`;
 const tr=S.agent&&S.agent.trade&&S.agent.trade.status==="OPEN"?S.agent.trade:null,pr=a.primary?a.scenarios[a.primary]:null;
 if(tr)h+=tradeCard(tr);
 else if(a.status==="VALID_ENTRY"&&pr&&pr.plan)h+=PlanCard(scPlan(pr,"VALID ENTRY"));
 else h+=EntryBlock(a);
 h+=`<div class="two">${LiquidityBlock(a)}${StructureBlock(a)}</div>${NewsBlock(a)}${ConfidenceBlock(a)}${ExplainBlock(a)}${AnalysisPanel(a)}${WarnBlock(a)}${DebugBlock(a)}`;
 h+=`<footer>مساعد قرار مبني على بيانات متاحة حالياً، مش توقع للمستقبل ولا ضمان ربح. لا يوجد دخول من غير تأكيد M5، وأي صفقة B/C بتتحول لـWAIT.</footer>`;return h}

function checkRows(sc){return sc.breakdown.map(b=>{const ok=b.factor>0;return `<div class="chk"><i class="${ok?"pos":"dim"}">${ok?"✓":"✗"}</i><div><b>${b.label}</b> <small style="display:inline">${b.pts}/${b.weight}</small><small>${b.detail}</small></div></div>`}).join("")}
function scenCard(sc,name){const b=BADGE[sc.status]||[sc.status,"b-no","no"];
 let h=`<div class="card hero ${b[2]}"><div class="head"><div><h3>${name}</h3><div class="headline">${b[0]}</div></div><div style="text-align:end"><span class="badge ${GR[sc.grade]||"b-no"}">${sc.grade}</span><div class="sub" style="margin:4px 0 0">${sc.confidence}%</div></div></div>`;
 if(sc.status==="DISABLED")h+=`<div class="sub" style="margin-top:6px">${sc.waitFor}</div></div>`;
 else{h+=`<div style="margin-top:8px">${checkRows(sc)}</div>`;
  h+=`<div class="ck">${Object.entries(sc.mand).map(([k,v])=>`<span class="${v?"ok":"no"}">${v?"✓":"✗"} ${MAND_AR[k]||k}</span>`).join("")}</div>`;
  if(sc.modifiers.length)h+=`<p class="sub" style="margin:4px 0">${sc.modifiers.map(m=>m.label+" ("+(m.pts>0?"+":"")+m.pts+")").join(" · ")}</p>`;
  if(sc.waitFor)h+=`<p style="margin:8px 0 0"><b>WAIT FOR:</b> ${sc.waitFor}</p>`;
  if(sc.entryZone&&sc.plan)h+=`<div class="lines"><div><span>Entry Zone</span><b>${f2(sc.entryZone.lo)} – ${f2(sc.entryZone.hi)}</b><small>${sc.entryZone.parts.join(" + ")}</small></div><div><span>Aggr. / Pref. / Cons.</span><b>${f2(sc.entryZone.aggressive)} / ${f2(sc.entryZone.preferred)} / ${f2(sc.entryZone.conservative)}</b></div><div><span>SL</span><b class="neg">${f2(sc.plan.sl)}</b></div>${sc.plan.tps.map((t,i)=>`<div><span>TP${i+1}</span><b class="pos">${f2(t.price)}</b><small>1:${t.rr} · ${t.src}</small></div>`).join("")}</div>`;
  if(sc.invalidationText)h+=`<p style="margin:6px 0 0"><b>INVALIDATION:</b> ${sc.invalidationText}</p>`;
  if(sc.ifThen&&sc.ifThen.length)h+=list(sc.ifThen);h+=`</div>`}
 return h}
function pScen(){
 const a=S.an;let h=head("Scenarios","سيناريو BUY وسيناريو SELL، كل واحد بشروطه ودرجته. الوكيل بيحتفظ بسيناريو فعّال لحد ما يتحقق أو يفشل.");
 if(!a||!a.scenarios)return h+(a?agentHero():unavail("Scenarios","لا توجد شموع بعد"));
 const ag=S.agent;
 if(ag&&ag.scenario)h+=`<div class="card"><h3>ACTIVE SCENARIO</h3><div class="headline">${ag.scenario.side} · ${ag.stage}</div><p class="sub" style="margin:0">بدأ ${cFull(ag.scenario.createdT)} · ينتهي ${cFull(ag.scenario.expiresT)}${ag.scenario.zone?" · منطقة "+ag.scenario.zone.tf+" "+f2(ag.scenario.zone.lo)+"–"+f2(ag.scenario.zone.hi):""}</p></div>`;
 else if(ag)h+=`<div class="card"><h3>ACTIVE SCENARIO</h3><p class="sub" style="margin:0">لا يوجد سيناريو فعّال (${ag.stage||"NEUTRAL"}).</p></div>`;
 if(ag&&ag.trade&&ag.trade.status==="OPEN")h+=tradeCard(ag.trade);
 h+=agentHero();
 const sp=a.decision&&a.decision.scenarios;
 if(sp)h+=`<div class="card"><h3>PRIMARY / ALTERNATIVE</h3>${sp.primary?`<p style="margin:0 0 6px"><b>PRIMARY (${sp.primary.side}):</b> ${sp.primary.text}</p>`:""}${sp.alternative?`<p style="margin:0 0 6px"><b>ALTERNATIVE (${sp.alternative.side}):</b> ${sp.alternative.text}</p>`:""}<p style="margin:0"><b>CURRENT:</b> ${a.decision.decision.replace("_"," ")}</p></div>`;
 if(a.conflict)h+=`<p class="note"><b>CONFLICT</b> · H1 ${a.conflict.h1} / M15 ${a.conflict.m15} / M5 ${a.conflict.m5} → ${a.conflict.action}. ${a.conflict.reason}</p>`;
 const order=a.primary==="SELL"?["SELL","BUY"]:["BUY","SELL"];
 order.forEach(s=>{h+=scenCard(a.scenarios[s],s+" SCENARIO")});
 h+=`<div class="card"><h3>القواعد</h3><p class="sub" style="margin:0">H1 = الاتجاه · M15 = السيولة والبنية والـsetup · M5 = التأكيد. فقط A+ وA بتتحول لإشارة (في وضع Ranging: A+ فقط). A+ يحتاج: توافق H1، سحب سيولة جودته عالية، كسر M15 صالح، displacement قوي، FVG/OB جودة عالية، تأكيد M5، RR ≥ الحد الأدنى، وخطر أخبار منخفض. B/C = WAIT.</p></div>`;
 return h}
function setCfg(k,v){CFG[k]=v;saveCfg();S.sig="";runAnalysis("config");render()}
function pSet(){
 const tg=(k,t,d)=>`<div class="row"><p style="flex:1"><b>${t}</b><small>${d}</small></p><button class="btn ${CFG[k]?"on":""}" onclick="toggleCfg('${k}')">${CFG[k]?"ON":"OFF"}</button></div>`;
 const ch=(k,t,d,opts)=>`<div class="row"><p style="flex:1"><b>${t}</b><small>${d}</small></p><span class="tfs">${opts.map(o=>`<button class="btn ${CFG[k]===o?"on":""}" onclick="setCfg('${k}',${typeof o==="number"?o:"'"+o+"'"})">${o}</button>`).join("")}</span></div>`;
 let h=head("Settings","إعدادات العرض والمراقبة والمحرك.");
 h+=`<div class="card"><h3>المراقبة</h3>${tg("auto","AUTO MONITORING","ON: السعر كل 10 ثواني وتحليل جديد مع كل شمعة M5 وتحديث الملفات كل دقيقة ونص. OFF: تحديث أبطأ وبدون تحليل تلقائي. الوكيل على السيرفر شغال دايماً في الحالتين.")}${tg("toast","تنبيهات داخل الصفحة","رسائل منبثقة لما يحصل حدث مهم والصفحة مفتوحة.")}${tg("sound","صوت التنبيه","نغمة قصيرة مع التنبيه.")}</div>
 <div class="card"><h3>المحرك (للعرض داخل الصفحة)</h3>${ch("minRR","Minimum RR","أقل RR مسموح لإشارة A/A+ (الافتراضي 2).",[2,2.5,3])}${ch("minGrade","Minimum grade","A = A وA+ · A+ = الأفضل فقط.",["A","A+"])}${tg("debug","DEBUG_ENGINE","يعرض PASS/FAIL لكل شرط في صفحة Live Analysis.")}<p class="sub" style="margin:8px 0 0">الإعدادات دي بتأثر على عرض الصفحة فقط. وكيل السيرفر (الإشعارات واليومية) بيستخدم الإعدادات الافتراضية من <code>engine.js</code>.</p></div>
 <div class="card"><h3>الشارت</h3>${tg("zones","Supply / Demand","مناطق الـOrder Block القريبة.")}${tg("fvg","FVG","فجوات القيمة العادلة غير المملوءة.")}${tg("liq","Liquidity","أقرب مستويات السيولة غير الملموسة.")}${tg("bos","BOS / CHoCH","أسهم على الشارت.")}</div>
 <div class="card"><h3>مصدر البيانات</h3><p style="margin:0">XAUUSD الفوري من <b>gold-api.com</b> (مجاني، بدون مفتاح، يسمح بالقراءة من المتصفح). السيرفر بيجمّع عينات كل 10 ثواني ويبني منها شموع M1 ثم M5/M15/H1. الشموع تقريبية ومش مطابقة 100% لشموع الوسيط. الأخبار من تقويم ForexFactory الأسبوعي، وDXY والعوائد من <code>data.json</code> (الخزانة الأمريكية وYahoo).</p><p class="sub" style="margin:8px 0 0">لربط مصدر تاني (TradingView / Twelve Data / غيره): المصدر معزول في دالة <code>spot_goldapi()</code> داخل <code>collect.py</code> (جدول PROVIDERS). مصادر غير gold-api لسه غير مفعّلة لأنها محتاجة مفتاح API ولم تُختبر.</p></div>
 <div class="card"><h3>إشعارات الموبايل (ntfy)</h3><p style="margin:0">السيرفر بيبعت: ZONE APPROACHING · LIQUIDITY SWEEP · CONFIRMATION · ENTRY VALID · TP1/2/3 · SL · SCENARIO INVALIDATED · HIGH IMPACT NEWS. لتقليلها حط متغير الريبو <code>ALERTS</code> بقائمة أنواع مفصولة بفاصلة (مثلاً <code>ENTRY_VALID,SL_HIT,TP1_HIT</code>).</p></div>
 <div class="card"><button class="btn" onclick="try{localStorage.clear()}catch(e){};location.reload()">مسح الإعدادات المحفوظة</button></div>`;return h}
function runAnalysis(why){
 if(!window.Engine||!S.m1.length)return;const prev=S.an;
 try{S.an=Engine.analyze({m1:S.m1,nowS:nowS(),price:S.px?S.px.price:undefined,news:S.news,macro:Engine.macroFromDrivers(S.data&&S.data.drivers),config:{minRR:CFG.minRR,minGrade:CFG.minGrade},debug:CFG.debug})}catch(e){S.an={status:"ERROR",reasons:["Engine error: "+e.message],now:nowS()}}
 S.anAt=Date.now();S.m5k=Math.floor(nowS()/300);
 if(prev&&S.an.status==="VALID_ENTRY"&&prev.status!=="VALID_ENTRY")toast("ENTRY VALID · "+S.an.signal+" "+(S.an.decision?S.an.decision.grade:"")+" — راجع خطة الصفقة","entry")}

const VIEWS={live:pLive,scen:pScen,liq:pLiq,news:pNews,jrnl:pJrnl,dash:pDash,sess:pSess,perf:pPerf,set:pSet};
function render(){
 const k=(location.hash.replace("#/","")||"live");const key=VIEWS[k]?k:"live";S.rendered=true;
 $("nav").innerHTML=`<h1>XAUUSD AI Agent<small>H1 اتجاه · M15 setup · M5 تأكيد</small></h1>`+PAGES.map(p=>`<a href="#/${p[0]}" class="${p[0]===key?"on":""}"><i>${p[1]}</i><span>${p[2]}<small>${p[3]}</small></span></a>`).join("");
 let body;try{body=VIEWS[key]()}catch(e){body=unavail(key,"خطأ في العرض: "+e.message)}
 $("view").innerHTML=topBar()+body;
 if(key==="live")drawChart();
 paintTop()}
addEventListener("hashchange",()=>{S.sig="";render();scrollTo(0,0)});
render();loadAll().then(()=>pxTick());timers();setInterval(paintTop,1000);

</script>
